<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds - Mapping Prototype 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!--
    This prototype tests a two-dimensional mapping: vertical position selects a
    note name, while horizontal position selects its octave.
    -->
    <main class="prototype">
        <header class="intro">
            <p class="eyebrow">Area 1 - Garden of Sounds</p>
            <h1>Mapping Prototype 3</h1>
            <p>Move vertically from C to B and horizontally from octave 1 to octave 8.</p>
        </header>

        <button id="play-button" class="playButton" type="button">Play Garden</button>

        <section
            id="sound-canvas"
            class="soundCanvas"
            aria-label="Two-dimensional sound mapping canvas"
        >
            <span class="axisLabel axisLabelHigh" aria-hidden="true">B</span>
            <span class="axisLabel axisLabelLow" aria-hidden="true">C</span>
            <span class="axisLabel axisLabelLeft" aria-hidden="true">Octave 1</span>
            <span class="axisLabel axisLabelRight" aria-hidden="true">Octave 8</span>

            <button
                class="soundObject soundObjectOne"
                type="button"
                aria-label="Drag sound object 1"
            >
                <span aria-hidden="true">&#10047;</span>
            </button>
            <button
                class="soundObject soundObjectTwo"
                type="button"
                aria-label="Drag sound object 2"
            >
                <span aria-hidden="true">&#10048;</span>
            </button>
        </section>

        <section class="testingInfo" aria-label="Current sound mapping values">
            <p id="object-one-info"></p>
            <p id="object-two-info"></p>
        </section>
    </main>
</body>
</html>
